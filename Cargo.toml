[package]
name = "diktation"
version = "1.0.0"
edition = "2024"

[lib]
# staticlib : liée dans l'app Swift ; rlib : pour le binaire de test en ligne de commande.
crate-type = ["staticlib", "rlib"]

[dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
cpal = "0.16"
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSData"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSWorkspace"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hound = "3.5"

[profile.release]
# Une panique ne doit jamais traverser l'API C vers Swift.
panic = "abort"
debug = false
# rust-objcopy du toolchain rustup est cassé sur ce Mac (libLLVM manquante).
strip = false
lto = "thin"
